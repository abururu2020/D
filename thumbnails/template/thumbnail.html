<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=block" rel="stylesheet"><style>

<script>
const g=document.getElementById('crowd');let s='';const r=n=>{let x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)};
for(let row=0;row<3;row++)for(let i=0;i<34;i++){const x=470+i*24+r(i+row*50)*16,y=650+row*26,k=.75+row*.2+r(i*3+row)*.1;
s+=`<g transform="translate(${x},${y}) scale(${k})" fill="${['#2a160c','#1a0d07','#0d0604'][row]}"><path d="M-14,80 Q-15,22 -8,10 Q0,4 8,10 Q15,22 14,80Z"/><circle cx="0" cy="0" r="8"/></g>`}
g.innerHTML=s;
</script>
